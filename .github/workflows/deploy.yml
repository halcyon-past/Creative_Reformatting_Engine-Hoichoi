name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-free-tier
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to AWS Free Tier
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/hoichoi-cre:latest
            ${{ steps.login-ecr.outputs.registry }}/hoichoi-cre:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/hoichoi-cre-web:latest
            ${{ steps.login-ecr.outputs.registry }}/hoichoi-cre-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via AWS SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          TARGET_INSTANCE="$INSTANCE_ID"
          if [ -z "$TARGET_INSTANCE" ]; then
            TARGET_INSTANCE=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=hoichoi-cre-dev" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          echo "Target EC2 instance: $TARGET_INSTANCE"

          # Script to run remotely on EC2
          REMOTE_SCRIPT=$(cat <<EOF
          set -e
          echo "Logging into ECR..."
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

          echo "Pulling latest images..."
          docker pull $REGISTRY/hoichoi-cre:latest
          docker pull $REGISTRY/hoichoi-cre-web:latest

          echo "Stopping existing containers..."
          docker stop cre-web || true
          docker stop cre-api || true
          docker rm cre-web || true
          docker rm cre-api || true

          echo "Ensuring volume permissions..."
          mkdir -p /data
          chown -R 10001:10001 /data
          chmod 777 /data

          echo "Starting backend container..."
          docker run -d --restart always --name cre-api \
            --env-file /opt/cre/.env -v /data:/data -p 8000:8000 \
            --log-driver awslogs \
            --log-opt awslogs-region=$AWS_REGION \
            --log-opt awslogs-group=/cre/hoichoi-cre-dev \
            --log-opt awslogs-stream=api \
            $REGISTRY/hoichoi-cre:latest

          echo "Starting frontend container..."
          docker run -d --restart always --name cre-web \
            -p 80:80 --link cre-api:api \
            --log-driver awslogs \
            --log-opt awslogs-region=$AWS_REGION \
            --log-opt awslogs-group=/cre/hoichoi-cre-dev \
            --log-opt awslogs-stream=web \
            $REGISTRY/hoichoi-cre-web:latest

          echo "Pruning older images to stay well within 30GB EBS free tier..."
          docker image prune -af --filter "until=24h" || true
          EOF
          )

          # Base64 encode script to safely pass via SSM without shell escaping issues
          B64_CMD=$(echo "$REMOTE_SCRIPT" | base64 | tr -d '\r\n')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64_CMD | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent (ID: $CMD_ID). Waiting for completion..."
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$TARGET_INSTANCE" \
            --query "Status" \
            --output text)

          echo "Execution status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "--- Standard Output ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE" --query "StandardOutputContent" --output text
            echo "--- Standard Error ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE" --query "StandardErrorContent" --output text
            exit 1
          fi

          echo "Deployment command completed successfully!"

      - name: Verify Live Health
        run: |
          APP_URL="${{ secrets.CRE_APP_URL || 'http://100.28.92.125' }}"
          echo "Verifying application health at: $APP_URL/health"
          for i in {1..15}; do
            if curl -s -f "$APP_URL/health"; then
              echo ""
              echo "=== Application is healthy and serving requests! ==="
              exit 0
            fi
            echo "Waiting for app to start... ($i/15)"
            sleep 4
          done
          echo "Health check failed or timed out!"
          exit 1
