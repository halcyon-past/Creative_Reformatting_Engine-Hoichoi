[project]
name = "cre"
version = "0.1.0"
description = "Creative Reformatting Engine - subject-aware multi-ratio media pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "PyYAML>=6.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.14",
    "opencv-contrib-python-headless>=4.10,<5",
    "mediapipe>=0.10.14,<0.11",
    "imageio-ffmpeg>=0.5",
    "Pillow>=11.0",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.35", "asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
cre = "cre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the documented idiom
    "N812",    # lowercase imported as non-lowercase (numpy/cv2 conventions)
    "RUF046",  # int(round(x)): explicit about the pixel-index intent
    "SIM105",  # try/except/pass around native teardown reads better than suppress()
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["slow: long-running media tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
